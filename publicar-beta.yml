
name: Publicar BuzzHub Beta

on:
  push:
    branches:
      - principal
    paths:
      - 'BuzzDataBase_Site.zip'
      - '.github/workflows/publicar-beta.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extrair BuzzHub ZIP
        run: |
          mkdir -p _site
          unzip -q BuzzDataBase_Site.zip -d _site
          test -f _site/index.html

      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar BuzzHub Beta
        id: deployment
        uses: actions/deploy-pages@v4
        
